name: Experimental scsynth Android probe

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/0.4.5-android-audio-driver, migration/reconcile-jo1ngf-2026-11-12]
    paths:
      - "tools/probe-scsynth-android.sh"
      - "tools/SC_AndroidAudio.cpp"
      - "tools/SoftcutDiagnosticSnapshot.h"
      - "tools/SoftcutSignalAccumulator.h"
      - "tools/test-softcut-signal-accumulator.cpp"
      - "tools/compile-softcut-synthdef.scd"
      - "tools/test-softcut-recorder-gate.py"
      - "tools/validate-synthdef.py"
      - "tools/validate-native-output-gate.py"
      - "tools/validate-softcut-output-routing.py"
      - "app/**"
      - "tools/patch-scsynth-android.py"
      - "tools/build-mi-ugens-android.sh"
      - "tools/patch-mi-ugens-android.py"
      - "tools/mi-ugens-classes/**"
      - ".github/workflows/scsynth-android-probe.yml"
      - ".github/workflows/integrate-scsynth-android.yml"
      - "docs/SCSYNTH_PROBE.md"
  pull_request:
    paths:
      - "tools/probe-scsynth-android.sh"
      - "tools/SC_AndroidAudio.cpp"
      - "tools/SoftcutDiagnosticSnapshot.h"
      - "tools/compile-softcut-synthdef.scd"
      - "tools/test-softcut-recorder-gate.py"
      - "tools/validate-synthdef.py"
      - "tools/validate-softcut-output-routing.py"
      - "app/**"
      - "tools/patch-scsynth-android.py"
      - "tools/build-mi-ugens-android.sh"
      - "tools/patch-mi-ugens-android.py"
      - "tools/mi-ugens-classes/**"
      - ".github/workflows/scsynth-android-probe.yml"
      - ".github/workflows/integrate-scsynth-android.yml"
      - "docs/SCSYNTH_PROBE.md"

permissions:
  contents: read

concurrency:
  group: scsynth-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-probe]')
    name: Compile SuperCollider core (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # O pacote legado "tools" foi removido do repositório do Android SDK.
          # Instalar apenas platform-tools evita o erro "Failed to find package 'tools'".
          packages: 'platform-tools'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          # setup-android adiciona sdkmanager ao PATH; não presumir "latest",
          # pois versões atuais podem usar cmdline-tools/<versão>/bin.
          # Primeiro tenta o PATH; se necessário, procura nas cmdline-tools do SDK.
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -n "${ANDROID_HOME:-}" && -d "${ANDROID_HOME}/cmdline-tools" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager não encontrado no PATH nem em ${ANDROID_HOME:-ANDROID_HOME não definido}/cmdline-tools"
            echo "ANDROID_HOME=${ANDROID_HOME:-não definido}"
            echo "PATH=$PATH"
            exit 1
          fi
          echo "Usando sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          "$SDKMANAGER" --install "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME}/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Validate probe scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/probe-scsynth-android.sh
          bash -n tools/build-mi-ugens-android.sh
          python3 -m py_compile tools/patch-scsynth-android.py tools/patch-mi-ugens-android.py
          cmake --version
          ninja --version

      - name: Probe SuperCollider 3.14.1 for Android ARM64
        shell: bash
        env:
          SC_TAG: Version-3.14.1
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          set -o pipefail
          bash tools/probe-scsynth-android.sh

      - name: Upload probe logs and native outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scsynth-android-probe-${{ github.run_number }}
          path: |
            .sc-probe/logs/**
            .sc-probe/build-arm64/**/libscsynth.so
            .sc-probe/build-arm64/**/libscsynth.a
            .sc-probe/build-arm64/**/*UGens*.so
            .sc-probe/build-arm64/server/plugins/MiRings.so
            .sc-probe/build-arm64/server/plugins/MiClouds.so
            .sc-probe/logs/mi-ugens-sha256.txt
            .sc-probe/logs/mi-ugens-source-sha256.txt
          if-no-files-found: warn
          retention-days: 14

# Manual Stratum ARM64 build request: compile pinned MiRings and MiClouds for the feature br
