name: Extrair ZIP
on: workflow_dispatch
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair e commitar
        run: |
          set -euo pipefail
          Z="$(ls nornsmobileevoo*.zip | head -n1)"
          mkdir /tmp/x && unzip -q "$Z" -d /tmp/x
          SRC="$(find /tmp/x -mindepth 1 -maxdepth 1 -type d | head -n1)"
          rsync -a --exclude='.git' --exclude='.github/workflows' "$SRC"/ ./
          mkdir -p _workflows_para_copiar
          cp "$SRC"/.github/workflows/*.yml _workflows_para_copiar/
          git rm -q "$Z"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Extrai projeto do ZIP"
          git push
