name: Engine Lab (sclang)

on:
  workflow_dispatch:
  push:
    branches: [fix/monitor-mudo-por-padrao]
    paths:
      - 'tools/engine-lab/**'
      - '.github/workflows/engine-lab.yml'

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install SuperCollider, plugins and JACK
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y supercollider-language supercollider-server jackd2 xvfb
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y sc3-plugins || echo "sc3-plugins indisponível"
      - name: Fetch norns crone classes (pinned)
        run: |
          git clone https://github.com/monome/norns "$RUNNER_TEMP/norns"
          git -C "$RUNNER_TEMP/norns" checkout 227aa0442181e3eab3fc189ee6b5342648ce7300
          echo "NORNS_DIR=$RUNNER_TEMP/norns" >> "$GITHUB_ENV"
      - name: Fetch engines whose repos carry no license (not vendored; pinned)
        run: |
          # Estes repositórios não têm arquivo de licença, então o código não é copiado para cá:
          # a CI baixa a revisão exata, usa só como entrada do laboratório e descarta.
          fetch() { # nome url commit
            git clone --quiet "$2" "$RUNNER_TEMP/ext/$1"
            git -C "$RUNNER_TEMP/ext/$1" checkout --quiet "$3"
          }
          fetch glut https://github.com/artfwo/glut f92324261df2603333ea21c8e9850ff98432776f
          fetch awake-rings https://github.com/GoneCaving/awake-rings d5df0b6a92d215da28e5b94df2f8cc2193c8cfa9
          echo "EXT_DIR=$RUNNER_TEMP/ext" >> "$GITHUB_ENV"
      - name: Start dummy JACK
        run: |
          export JACK_NO_AUDIO_RESERVATION=1
          nohup jackd -r -d dummy -r 48000 -p 1024 > /tmp/jack.log 2>&1 &
          sleep 4; cat /tmp/jack.log
      - name: Run lab for each engine
        run: |
          set +e
          cd tools/engine-lab
          run() { bash run-lab.sh "$1" "$2" "$GITHUB_WORKSPACE/report/$2"; }
          run sources/bline Engine_Bline_Synth
          run sources/fall Engine_Autumn
          run sources/flora Engine_BandSaw
          run sources/pixels Engine_Pixelbangs
          run sources/time-rhythm Engine_TimeRhythm
          run sources/awed Engine_Sawed
          run sources/terrarium Engine_Terrarium
          run sources/molly-the-poly Engine_MollyThePoly
          run sources/passersby Engine_Passersby
          run sources/thebangs Engine_Thebangs
          # PolySub e TestSine vêm do próprio norns (revisão fixada acima). Cada um roda sozinho:
          # o PolySub registra o SynthDef ao iniciar a classe e contaminaria o relatório dos outros.
          for e in PolySub TestSine; do
            mkdir -p "$RUNNER_TEMP/core-$e"
            cp "$NORNS_DIR/sc/engines/Engine_$e.sc" "$RUNNER_TEMP/core-$e/"
            run "$RUNNER_TEMP/core-$e" "Engine_$e"
          done
          run "$EXT_DIR/glut" Engine_Glut
          run "$EXT_DIR/awake-rings" Engine_KarplusRings
          true
      - name: Show load and compile errors (debug)
        run: |
          for d in report/*/; do
            echo "=== $d"
            grep -h -m6 -E "^(ERROR|### ENGINE_LOAD_|### LAB_ERROR|### CMD_ERROR|exit=)" "$d/sclang.log" "$d/osc.log" 2>/dev/null | cut -c1-220
          done
      - name: Summarize
        run: python3 tools/engine-lab/analyze.py report app/src/main/assets/scsynth/plugins | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-lab-report
          path: report
